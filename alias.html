<!doctype html>
<html lang="en" data-page="alias">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=900">
  <title>D-Grüv</title>
  <meta name="description" content="Gigs, DJ sets and productions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
  <style>html { background: #161616; }</style>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Brand graphic: the arrows symbol -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 120 180">
      <g fill="none" stroke="#ff5a1f" stroke-width="5">
        <path d="M60 0 V79 M28 47 L60 79 L92 47"/>
        <path d="M60 180 V101 M28 133 L60 101 L92 133"/>
      </g>
      <circle cx="60" cy="90" r="6" fill="#ff5a1f"/>
    </symbol>
  </svg>

  <header class="nav">
    <a href="#top" class="nav-logo" id="nav-name" data-artist-name></a>
    <nav>
      <a href="#gigs">Gigs</a>
      <a href="#sets">Sets</a>
      <a href="#tracks">Tracks</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="brand">
        <h1 id="artist-name" class="hero-name" data-artist-name></h1>
        <span class="brand-line" aria-hidden="true"></span>
        <svg class="brand-mark" viewBox="0 0 120 180">
          <g fill="none" stroke="#ff5a1f" stroke-width="5" aria-hidden="true">
            <path class="arrow-top" d="M60 0 V79 M28 32 L60 0 L92 32"/>
            <path class="arrow-bottom" d="M60 180 V101 M28 148 L60 180 L92 148"/>
          </g>
          <!-- the dot leads back to germ1 (transition in motion.js) -->
          <a class="portal" href="index.html" aria-label="Back to germ1">
            <circle class="portal-hit" cx="60" cy="90" r="18" fill="transparent"/>
            <circle class="dot" cx="60" cy="90" r="6" fill="#ff5a1f"/>
          </a>
        </svg>
      </div>
      <script>
        // Opening animation (styles.css, ".intro"), skipped for reduced motion
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("intro");
      </script>
      <p class="tagline" id="artist-tagline" hidden></p>
    </section>

    <section id="gigs" class="section">
      <h2>Upcoming gigs</h2>
      <ul class="gig-list" id="upcoming-gigs"></ul>
      <details class="past" id="past-wrap">
        <summary><svg class="px px-chevron" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 1h1v1h-1z M3 2h1v1h-1z M4 3h1v1h-1z M3 4h1v1h-1z M2 5h1v1h-1z"/></svg>Past gigs</summary>
        <ul class="gig-list" id="past-gigs"></ul>
      </details>
    </section>

    <section id="sets" class="section">
      <h2>DJ sets</h2>
      <div class="cards" id="sets-list"></div>
    </section>

    <section id="tracks" class="section">
      <h2>Productions</h2>
      <div class="cards" id="tracks-list"></div>
    </section>

    <section id="about" class="section about">
      <h2>About</h2>
      <div class="about-grid">
        <img id="artist-photo" alt="" hidden>
        <div>
          <p id="artist-bio"></p>
          <p><a class="btn" id="booking-link">Booking</a></p>
          <ul class="socials" id="socials"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <svg class="footer-mark" viewBox="0 0 120 180" aria-hidden="true"><use href="#mark"/></svg>
    <span id="footer-text"></span>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
  <script src="motion.js"></script>
  <script src="player.js"></script>
</body>
</html>
