<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=900">
  <title>germ1</title>
  <meta name="description" content="Gigs, DJ sets and productions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
  <style>html { background: #e4e4e4; }</style>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Brand graphics: the germ1 wordmark and the arrows symbol -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="wordmark" viewBox="0 0 200 80">
      <g fill="none" stroke-width="4">
        <g stroke="#2b2b2b">
          <circle cx="22" cy="40" r="18"/>
          <path d="M40 22 V74 H8"/>
          <path d="M52 40 H88 A18 18 0 1 0 83.8 51.6"/>
          <path d="M100 60 V22 M100 38 A17 17 0 0 1 117 21"/>
          <path d="M128 60 V22 M128 34 A12 12 0 0 1 152 34 V60 M152 34 A12 12 0 0 1 176 34 V60"/>
        </g>
        <path stroke="#ff5a1f" d="M196 60 V4 M196 4 L183 22"/>
      </g>
    </symbol>
    <symbol id="mark" viewBox="0 0 120 180">
      <g fill="none" stroke="#ff5a1f" stroke-width="5">
        <path d="M60 0 V79 M28 47 L60 79 L92 47"/>
        <path d="M60 180 V101 M28 133 L60 101 L92 133"/>
      </g>
      <circle cx="60" cy="90" r="6" fill="#ff5a1f"/>
    </symbol>
  </svg>

  <header class="nav">
    <a href="#top" class="nav-logo" id="nav-name"><svg viewBox="0 0 200 80" aria-hidden="true"><use href="#wordmark"/></svg></a>
    <nav>
      <a href="#gigs">Gigs</a>
      <a href="#sets">Sets</a>
      <a href="#tracks">Tracks</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="brand">
        <h1 id="artist-name" class="wordmark" aria-label="germ1">
          <!-- same drawing as the "wordmark" symbol, inline so each stroke can animate -->
          <svg viewBox="0 0 200 80" fill="none" stroke-width="4" aria-hidden="true">
            <g stroke="#2b2b2b">
              <circle style="--i:0" cx="22" cy="40" r="18" transform="rotate(-90 22 40)"/>
              <path style="--i:1" d="M40 22 V74 H8"/>
              <path style="--i:2" d="M52 40 H88 A18 18 0 1 0 83.8 51.6"/>
              <path style="--i:3" d="M100 60 V22 M100 38 A17 17 0 0 1 117 21"/>
              <path style="--i:4" d="M128 60 V22 M128 34 A12 12 0 0 1 152 34 V60 M152 34 A12 12 0 0 1 176 34 V60"/>
            </g>
            <path style="--i:5" stroke="#ff5a1f" d="M196 60 V4 M196 4 L183 22"/>
          </svg>
        </h1>
        <span class="brand-line" aria-hidden="true"></span>
        <svg class="brand-mark" viewBox="0 0 120 180">
          <g fill="none" stroke="#ff5a1f" stroke-width="5" aria-hidden="true">
            <path class="arrow-top" d="M60 0 V79 M28 47 L60 79 L92 47"/>
            <path class="arrow-bottom" d="M60 180 V101 M28 133 L60 101 L92 133"/>
          </g>
          <!-- the dot is a door to the alias page (transition in motion.js) -->
          <a class="portal" href="alias.html" aria-label="Go to the alias page">
            <circle class="portal-hit" cx="60" cy="90" r="18" fill="transparent"/>
            <circle class="dot" cx="60" cy="90" r="6" fill="#ff5a1f"/>
          </a>
        </svg>
      </div>
      <script>
        // Opening animation: measure each logo stroke so it can draw itself in (styles.css, ".intro").
        (function () {
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          // Coming back from the alias through the dot: show the page as it is, no redraw,
          // so it carries on from the transition.
          try {
            if (sessionStorage.getItem("germ1-portal")) { sessionStorage.removeItem("germ1-portal"); return; }
          } catch (e) {}
          document.querySelectorAll(".wordmark svg path, .wordmark svg circle").forEach(function (el) {
            el.style.setProperty("--len", Math.ceil(el.getTotalLength()) + 1);
          });
          document.documentElement.classList.add("intro");
        })();
      </script>
      <p class="tagline" id="artist-tagline" hidden></p>
    </section>

    <section id="gigs" class="section">
      <h2>Upcoming gigs</h2>
      <ul class="gig-list" id="upcoming-gigs"></ul>
      <details class="past" id="past-wrap">
        <summary><svg class="px px-chevron" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 1h1v1h-1z M3 2h1v1h-1z M4 3h1v1h-1z M3 4h1v1h-1z M2 5h1v1h-1z"/></svg>Past gigs</summary>
        <ul class="gig-list" id="past-gigs"></ul>
      </details>
    </section>

    <section id="sets" class="section">
      <h2>DJ sets</h2>
      <div class="cards" id="sets-list"></div>
    </section>

    <section id="tracks" class="section">
      <h2>Productions</h2>
      <div class="cards" id="tracks-list"></div>
    </section>

    <section id="about" class="section about">
      <h2>About</h2>
      <div class="about-grid">
        <img id="artist-photo" alt="" hidden>
        <div>
          <p id="artist-bio"></p>
          <p><a class="btn" id="booking-link">Booking</a></p>
          <ul class="socials" id="socials"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <svg class="footer-mark" viewBox="0 0 120 180" aria-hidden="true"><use href="#mark"/></svg>
    <span id="footer-text"></span>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
  <script src="motion.js"></script>
  <script src="player.js"></script>
</body>
</html>
