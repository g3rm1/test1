# Publishes the website to GitHub Pages on every push.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy website

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html styles.css app.js content.js motion.js player.js favicon.svg _site/
          for d in images audio; do [ -d "$d" ] && cp -r "$d" _site/ || true; done
          # Version the CSS/JS links so browsers load the latest files after each update
          sed -i -E "s/(href|src)=\"([a-z]+\.(css|js))\"/\1=\"\2?v=${GITHUB_SHA::7}\"/g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
